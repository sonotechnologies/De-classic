<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background:#FFFFFF;border-bottom:1px solid #D5E5E5;font-family:Figtree,sans-serif">
  <div style="max-width:1240px;margin:0 auto;padding:0 clamp(20px,4vw,40px);height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="Home%20A.dc.html" aria-label="De Classic Hotel, home" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px;letter-spacing:-0.05em;color:#111111;text-decoration:none;line-height:1">de classic</a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Main" style="display:flex;gap:28px;align-items:center">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" style="color:#111111;text-decoration:none;font-size:16px;font-weight:500;padding:6px 0;border-bottom:2px solid {{ l.line }}" style-hover="color:#0B5C5C">{{ l.label }}</a>
        </sc-for>
      </nav>
    </sc-if>
    <div style="display:flex;gap:8px;align-items:center">
      <a href="Book.dc.html" style="display:inline-flex;align-items:center;height:44px;padding:0 22px;border-radius:999px;background:#111111;color:#FFFFFF;font-weight:600;font-size:15px;text-decoration:none;transition:background 180ms ease-out" style-hover="background:#0B5C5C;color:#FFFFFF">Book now</a>
      <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ openMenu }}" aria-label="Open menu" style="width:44px;height:44px;border-radius:999px;border:1.5px solid #111111;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0">
          <span style="width:16px;height:2px;background:#111111;display:block"></span>
          <span style="width:16px;height:2px;background:#111111;display:block"></span>
        </button>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-label="Menu" style="position:fixed;inset:0;background:#B1ECEC;z-index:200;display:flex;flex-direction:column;padding:0 20px 32px;overflow:auto">
      <div style="height:72px;display:flex;align-items:center;justify-content:space-between">
        <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px;letter-spacing:-0.05em">de classic</span>
        <button onClick="{{ closeMenu }}" aria-label="Close menu" style="width:44px;height:44px;border-radius:999px;border:1.5px solid #111111;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:#111111">×</button>
      </div>
      <nav style="display:flex;flex-direction:column;gap:4px;margin-top:32px">
        <a href="Home%20A.dc.html" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:52px;letter-spacing:-0.04em;line-height:1.05;color:#111111;text-decoration:none">home</a>
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:52px;letter-spacing:-0.04em;line-height:1.05;color:#111111;text-decoration:none">{{ l.label }}</a>
        </sc-for>
      </nav>
      <div style="margin-top:auto;padding-top:40px;display:flex;flex-direction:column;gap:12px">
        <a href="Book.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:999px;background:#111111;color:#FFFFFF;font-weight:600;font-size:17px;text-decoration:none">Book now</a>
        <a href="tel:+2348000000000" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:999px;border:1.5px solid #111111;color:#111111;font-weight:600;font-size:17px;text-decoration:none">Call +234 800 000 0000</a>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;72px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;rooms&quot;,&quot;the bar&quot;,&quot;gallery&quot;,&quot;offers&quot;,&quot;locations&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { m: window.innerWidth < 760, open: false };
  componentDidMount() { this.onR = () => this.setState({ m: window.innerWidth < 760 }); window.addEventListener('resize', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const a = this.props.active;
    const links = [['rooms', 'Rooms.dc.html'], ['the bar', 'Bar.dc.html'], ['gallery', 'Gallery.dc.html'], ['offers', 'Offers.dc.html'], ['locations', 'Locations.dc.html']]
      .map(([label, href]) => ({ label, href, line: label === a ? '#111111' : 'transparent' }));
    return { links, mobile: this.state.m, desktop: !this.state.m, open: this.state.open,
      openMenu: () => this.setState({ open: true }), closeMenu: () => this.setState({ open: false }) };
  }
}
</script>
</body>
</html>
