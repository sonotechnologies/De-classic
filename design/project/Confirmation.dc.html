<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>body{margin:0;background:#B1ECEC;color:#111111;font-family:Figtree,sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#0B5C5C}a:hover{color:#111111}:focus-visible{outline:3px solid #111111;outline-offset:3px}</style>

      <div style="flex:1.4 1 360px;display:flex;flex-direction:column;gap:16px">
        <span data-anim="rise" data-delay="300" style="font-size:14px;font-weight:600;color:#0B5C5C">request sent · your reference</span>
        <span data-anim="rise" data-delay="420" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(72px,15vw,220px);line-height:0.85;letter-spacing:-0.06em">dc-4827</span>

      </div>
      <div data-anim="settle" data-delay="560" style="flex:1 1 320px;background:#FFFFFF;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;justify-content:space-between;gap:16px;font-size:16px"><span style="color:#5B6B6B">Room</span><span style="font-weight:600">Deluxe room</span></div>
        <div style="display:flex;justify-content:space-between;gap:16px;font-size:16px"><span style="color:#5B6B6B">Dates</span><span style="font-weight:600">16 – 18 Oct, 2 nights</span></div>
        <div style="display:flex;justify-content:space-between;gap:16px;font-size:16px"><span style="color:#5B6B6B">Guests</span><span style="font-weight:600">2 adults</span></div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-top:1px solid #D5E5E5;padding-top:14px"><span style="font-size:16px">Estimated total</span><span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px;letter-spacing:-0.03em">₦70,000</span></div>
        <a href="https://wa.me/2348000000000?text=Hi%2C%20my%20reference%20is%20DC-4827" style="margin-top:8px;display:flex;align-items:center;justify-content:center;height:56px;border-radius:999px;background:#111111;color:#FFFFFF;font-weight:600;font-size:16px;text-decoration:none;transition:background 180ms ease-out" style-hover="background:#0B5C5C;color:#FFFFFF">Send on WhatsApp</a>
        <a href="Home%20A.dc.html" style="display:flex;align-items:center;justify-content:center;height:48px;color:#0B5C5C;font-weight:600;text-decoration:none">Back to home</a>
      </div>
    </div>
  </main>
</div>
